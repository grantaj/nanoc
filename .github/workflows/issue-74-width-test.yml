name: issue-74-width-test

on:
  push:
    branches: [issue-74-ci3]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Apply issue 74 patches
        run: |
          git apply --check .github/issue74/width.patch
          git apply .github/issue74/width.patch
          git apply --check .github/issue74/shrink.patch
          git apply .github/issue74/shrink.patch
          git apply --check .github/issue74/compact-direct.patch
          git apply .github/issue74/compact-direct.patch
          git apply --check .github/issue74/compact-direct-fix.patch
          git apply .github/issue74/compact-direct-fix.patch
          git apply --check .github/issue74/arithmetic-shrink.patch
          git apply .github/issue74/arithmetic-shrink.patch
          git apply --check .github/issue74/fix-word-update-label.patch
          git apply .github/issue74/fix-word-update-label.patch
          git apply --check .github/issue74/final-shrink.patch
          git apply .github/issue74/final-shrink.patch
          git apply --check .github/issue74/no-deferred-load.patch
          git apply .github/issue74/no-deferred-load.patch
          git apply --check .github/issue74/char-direct-only.patch
          git apply .github/issue74/char-direct-only.patch
          git apply --check .github/issue74/last-39-shrink.patch
          git apply .github/issue74/last-39-shrink.patch
          git apply --check .github/issue74/final-four.patch
          git apply .github/issue74/final-four.patch
          git diff --check
          git diff --stat
      - name: Set up development environment
        run: make setup
      - name: Build all targets
        run: make
      - name: Run focused production statement tests
        run: make test-nanoc0-statements
      - name: Run production nanoc0 integration
        run: sh scripts/test-nanoc0-integration.sh
      - name: Record measurements
        if: always()
        run: |
          if [ -f build/nanoc0.prg ]; then
            bytes=$(wc -c < build/nanoc0.prg)
            echo "production nanoc0 loaded image: $((bytes - 2)) bytes"
          fi
          if [ -f build/nanoc0-core.prg ]; then
            bytes=$(wc -c < build/nanoc0-core.prg)
            echo "nanoc0 resident core: $((bytes - 2)) bytes"
          fi
          for f in build/nanoc0-integration/ASSFROMC.ASM build/nanoc0-integration/assfromc.asm; do
            if [ -f "$f" ]; then
              echo "bootstrap generated source: $(wc -c < "$f") bytes"
              echo "INC instructions: $(grep -Ec '^[[:space:]]*inc ' "$f" || true)"
              echo "DEC instructions: $(grep -Ec '^[[:space:]]*dec ' "$f" || true)"
              echo "fixed update skips: $(grep -Ec '^[[:space:]]*bne \\*\\+5' "$f" || true)"
              echo "AND immediate ff: $(grep -Ec 'and #\\$ff' "$f" || true)"
              echo "shift loop LSR high: $(grep -Ec 'lsr NC_TMP\\+1' "$f" || true)"
              break
            fi
          done
          if [ -f build/nanoc0-integration/assfromc.prg ]; then
            bytes=$(wc -c < build/nanoc0-integration/assfromc.prg)
            echo "bootstrap generated loaded image: $((bytes - 2)) bytes"
          fi
      - name: Capture issue 74 working sources
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue-74-compact-working-sources
          if-no-files-found: error
          path: |
            nanoc0/expression.asm
            nanoc0/expression_immediate.asm
            nanoc0/statements.asm
            nanoc0/statement_codegen.asm
            tests/nanoc0-stmt/statements.c
            tests/nanoc0-stmt/STMTOUT.ASM
            tests/nanoc0-stmt/stmtout.asm
            build/nanoc0-integration/ASSFROMC.ASM
            build/nanoc0-integration/assfromc.asm
