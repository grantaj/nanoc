name: nanoc2 targeted native ABI

# Separate from the fast CI gate: only the focused native smoke is run here.
# This is temporarily triggered by nanoc2 changes to establish the first
# real 6510 baseline. After the native gate is proven it can be dispatched
# manually as part of the full-correctness tier.
on:
  pull_request:
    paths:
      - 'nanoc2/**'
      - 'tests/nanoc2/**'
      - '.github/workflows/nanoc2-native.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  native-abi:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out nanoc
        uses: actions/checkout@v7.0.1
      - name: Set up C64 toolchain
        run: make setup
      - name: Execute original-parser generated 6502 under VICE
        run: python3 nanoc2/test_native.py
