name: nanoc2 targeted native ABI

# Native vasm+VICE is a separate on-demand correctness gate, never the
# mandatory fast PR feedback loop. Apply the "native-smoke" label to a PR
# for a one-off run, or explicitly dispatch the workflow on a branch
# once this workflow has landed on the default branch.
on:
  workflow_dispatch:
  pull_request:
    types: [labeled]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  native-abi:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.label.name == 'native-smoke'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out nanoc
        uses: actions/checkout@v7.0.1
      - name: Set up C64 toolchain
        run: make setup
      - name: Execute original-parser generated 6502 under VICE
        run: python3 nanoc2/test_native.py
      - name: Compare exact C function-body sizes with original nanoc1
        run: python3 nanoc2/test_size_spots.py
