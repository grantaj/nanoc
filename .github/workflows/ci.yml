name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Check out nanoc
        uses: actions/checkout@v7.0.1

      - name: Set up development environment
        run: make setup

      - name: Build all targets
        run: make

      - name: Validate candidate Phase 1 C assembler
        run: sh scripts/test-ass-c.sh

      - name: Run C64-native tests
        run: make test

      - name: Run production nanoc0 ladder
        run: sh scripts/test-nanoc0-integration.sh

      - name: Capture generated bootstrap assembly
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nanoc0-bootstrap-generated
          path: |
            build/nanoc0-integration/ASSFROMC.ASM
            build/nanoc0-integration/assfromc.asm
            tests/nanoc0-expr/EXPROUT.ASM
            tests/nanoc0-expr/exprout.asm
            nanoc0/expression.asm
            nanoc0/expression_codegen.asm
            nanoc0/expression_immediate.asm
            nanoc0/expression_codegen_state.asm
            nanoc0/runtime_codegen.asm
            nanoc0/calls.asm
            nanoc0/statement_codegen.asm
            nanoc0/test_expression_compile.asm
            nanoc0/target/compare16.asm
            ass/test_nanoc0_expressions.asm
            Makefile
          if-no-files-found: ignore
