name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Check out nanoc
        uses: actions/checkout@v7.0.1

      - name: Set up development environment
        run: make setup

      - name: Reuse generated assembler artifact
        uses: actions/download-artifact@v4
        with:
          name: nanoc0-bootstrap-generated
          path: build/nanoc0-integration
          github-token: ${{ github.token }}
          run-id: 34005979429

      - name: Walk directly into generated assembler
        shell: bash
        run: |
          mkdir -p build/direct-src
          cat > build/direct-src/SMALL.ASM <<'EOF'
          * = $1234
          lda #$42
          rts
          EOF

          # Keep the driver and generated program as separate PRGs. This removes
          # any ambiguity about holes/multiple origins in a CBM PRG.
          cat > build/direct-driver.asm <<'EOF'
          	* = $0200
          main:
          	jsr $413f                 ; __nc_init
          	lda #<rootName
          	sta $c83a                 ; __c_ass_assemble__v00
          	lda #>rootName
          	sta $c83b
          	lda #rootNameEnd-rootName
          	sta $c83c                 ; __v01
          	lda #<directory
          	sta $c83d                 ; __v02
          	lda #>directory
          	sta $c83e
          	lda #$00
          	sta $c83f                 ; __v03
          	lda #$00
          	ldx #$00                  ; final default_origin argument
          	jsr $3f99                 ; __c_ass_assemble
          .halt:
          	jmp .halt
          rootName:
          	byte 'S','M','A','L','L','.','A','S','M'
          rootNameEnd:
          directory:
          EOF

          vasm6502_oldstyle -Iass -Fbin -cbm-prg \
            -o build/generated-ass.prg build/nanoc0-integration/assfromc.asm
          vasm6502_oldstyle -Fbin -cbm-prg \
            -o build/direct-driver.prg build/direct-driver.asm

          cat > build/direct-walk.mon <<'EOF'
          load "build/generated-ass.prg" 0
          load "build/direct-driver.prg" 0
          > 0001 36
          break exec 0200
          break exec 413f
          break exec 3f99
          break exec 35e6
          g 0200
          r
          g
          r
          g
          r
          g
          r
          quit
          EOF

          timeout 5s x64sc -console -warp +sound \
            -iecdevice8 -device8 1 -fs8 "$PWD/build/direct-src" \
            -iecdevice9 -device9 1 -fs9 "$PWD/build/direct-src" \
            -initbreak ready -moncommands build/direct-walk.mon \
            >build/direct-walk.log 2>&1 || true
          cat build/direct-walk.log

          # The four breakpoints should all have executed in order. VICE prints
          # their PCs in the register dumps; fail quickly if we never reach the
          # generated source reader.
          grep -qi '35e6' build/direct-walk.log
