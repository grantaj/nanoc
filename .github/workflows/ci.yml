name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Check out nanoc
        uses: actions/checkout@v7.0.1

      - name: Set up development environment
        run: make setup

      - name: Build all targets
        run: make

      - name: Run C64-native tests
        run: make test
