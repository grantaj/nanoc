name: CI

# Only inexpensive, host-side checks run on every commit. This job deliberately
# does not install VICE/vasm, build PRGs, or run the native bootstrap.
on:
  pull_request:
  push:
    branches: [main]

# Compiling a new candidate makes older PR checks irrelevant. In particular,
# do not queue a second full emulator run for every intermediate edit.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    # Keep the existing CI / build check name for branch-protection rules.
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Check out nanoc
        uses: actions/checkout@v7.0.1

      - name: Check test script syntax
        run: |
          set -eu
          for script in scripts/*.sh tests/run-test.sh; do
            sh -n "$script"
          done

      - name: Check Phase-1 C source syntax
        run: |
          set -eu
          cc -std=c90 -funsigned-char -fsyntax-only nanoc1/nanoc1.c
          cc -std=c90 -funsigned-char -fsyntax-only bootstrap/ass.c

      - name: Test traversal-first compiler if present
        run: |
          set -eu
          if [ -f nanoc2/test_parser_tape.py ]; then
            timeout 150s python3 nanoc2/test_parser_tape.py
          fi
          if [ -f nanoc2/test_lower_tape.py ]; then
            timeout 150s python3 nanoc2/test_lower_tape.py
          fi
