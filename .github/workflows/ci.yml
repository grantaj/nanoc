name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Check out nanoc
        uses: actions/checkout@v7.0.1

      - name: Set up development environment
        run: make setup

      - name: Build all targets
        run: make

      - name: Build production nanoc0 entry
        run: |
          cd nanoc0
          vasm6502_oldstyle -Fbin -cbm-prg -o ../build/nanoc0.prg nanoc0.asm
          bytes=$(wc -c < ../build/nanoc0.prg)
          echo "production nanoc0 loaded image: $((bytes - 2)) bytes"

      - name: Validate candidate Phase 1 C assembler
        run: sh scripts/test-ass-c.sh

      - name: Run C64-native tests
        run: make test
