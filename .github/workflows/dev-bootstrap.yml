name: Oversized seed compiler (development layout)

# This is a costly research/bootstrap profile, not the PR correctness gate.
# Apply dev-bootstrap to a PR for a one-off run, or dispatch from Actions.
on:
  workflow_dispatch:
  pull_request:
    types: [labeled]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  development-bootstrap:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.label.name == 'dev-bootstrap'
    timeout-minutes: 120
    runs-on: ubuntu-24.04
    steps:
      - name: Check out nanoc
        uses: actions/checkout@v7.0.1
      - name: Set up C64 tools
        run: make setup
      - name: Check development test syntax
        run: sh -n scripts/test-nanoc1-development.sh
      - name: Exercise oversized seed and self-compilation on VICE
        run: sh scripts/test-nanoc1-development.sh
      - name: Preserve native development assembly
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: development-bootstrap-generated
          path: |
            build/nanoc0-integration/nanoc1dev.asm
            build/nanoc0-integration/NANOC1DEV.ASM
            build/nanoc0-integration/n1-self-compile.result
            build/nanoc0-integration/n1-ass.asm
            build/nanoc0-integration/nanoc2-size.prg
          if-no-files-found: ignore
